<!DOCTYPE html>
<html>

<head>
    <title>Abstraction: The Dashboard</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 60px;
            align-items: center;
        }

        .dashboard {
            width: 280px;
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }

        .engine-room {
            width: 300px;
            height: 350px;
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 10px;
        }

        .start-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #ef4444, #b91c1c);
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
            bottom: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(239, 68, 68, 0.4);
        }

        .start-btn.running {
            background: linear-gradient(145deg, #22c55e, #15803d);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.4);
        }

        .piston {
            width: 50px;
            height: 80px;
            background: #64748b;
            border-radius: 5px;
            position: relative;
        }

        .piston::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 40px;
            height: 40px;
            background: #94a3b8;
            transition: height 0.1s;
        }

        .piston.firing {
            background: #cbd5e1;
        }

        .piston.firing::after {
            height: 70px;
            background: #f59e0b;
            box-shadow: 0 0 15px #f59e0b;
        }

        .arrow {
            font-size: 40px;
            color: #64748b;
            animation: point 2s infinite;
        }

        @keyframes point {
            0% {
                opacity: 0.3;
                transform: translateX(0);
            }

            50% {
                opacity: 1;
                transform: translateX(10px);
            }

            100% {
                opacity: 0.3;
                transform: translateX(0);
            }
        }

        h3 {
            margin: 0 0 15px 0;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>🎭 Pillar 2: Abstraction</h1>
    <p style="color: #94a3b8; margin-bottom: 50px;">You interact with the simple interface (Button). The complex logic
        (Engine) happens automatically.</p>

    <div class="container">
        <!-- The Interface (Abstraction) -->
        <div class="dashboard">
            <h3>Public Interface</h3>
            <button class="start-btn" id="btn" onclick="toggleEngine()">START</button>
            <p style="margin-top: 20px; color: #cbd5e1; font-size: 14px;">User only calls <code
                    style="color: #60a5fa">car.start()</code></p>
        </div>

        <div class="arrow">➜</div>

        <!-- The Implementation (Complexity) -->
        <div class="engine-room" id="engine">
            <h3 style="position: absolute; top: 10px; width: 100%; text-align: center;">Hidden Complexity</h3>
            <div class="piston"></div>
            <div class="piston"></div>
            <div class="piston"></div>
            <div class="piston"></div>
            <div class="piston"></div>
            <div class="piston"></div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let interval;
        const btn = document.getElementById('btn');
        const pistons = document.querySelectorAll('.piston');

        function toggleEngine() {
            isRunning = !isRunning;

            if (isRunning) {
                btn.textContent = "STOP";
                btn.classList.add('running');
                // Start chaos
                interval = setInterval(() => {
                    pistons.forEach(p => {
                        if (Math.random() > 0.5) p.classList.add('firing');
                        else p.classList.remove('firing');
                    });
                }, 100);
            } else {
                btn.textContent = "START";
                btn.classList.remove('running');
                clearInterval(interval);
                pistons.forEach(p => p.classList.remove('firing'));
            }
        }
    </script>
</body>

</html>
