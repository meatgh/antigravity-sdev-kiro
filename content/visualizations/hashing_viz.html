<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Consistent Hashing Ring</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ring {
            fill: none;
            stroke: #444;
            stroke-width: 5px;
        }

        .node {
            stroke: #fff;
            stroke-width: 2px;
        }

        .key {
            fill: #FFEB3B;
            stroke: #fff;
            stroke-width: 1px;
        }

        .label {
            fill: #fff;
            font-size: 12px;
            pointer-events: none;
        }

        .btn {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #00BCD4;
            color: white;
            border: none;
        }
    </style>
</head>

<body>
    <h1>Consistent Hashing Ring</h1>
    <p>Yellow dots (Keys) map to clockwise Nodes (Colored). Virtual Nodes improve balance.</p>
    <button class="btn" onclick="addNode()">Add Node (Rebalance)</button>
    <svg width="600" height="600" id="viz"></svg>
    <script>
        const svg = d3.select("#viz");
        const radius = 250;
        const center = { x: 300, y: 300 };

        let nodes = [
            { id: "A", angle: 0, color: "#F44336" },
            { id: "B", angle: 2, color: "#4CAF50" },
            { id: "C", angle: 4, color: "#2196F3" }
        ];

        // Random Keys
        const keys = d3.range(50).map(i => ({ id: i, angle: Math.random() * 6.28 }));

        svg.append("circle").attr("cx", center.x).attr("cy", center.y).attr("r", radius).attr("class", "ring");

        function draw() {
            // Draw Keys
            svg.selectAll(".key").data(keys).join("circle")
                .attr("class", "key")
                .attr("r", 5)
                .attr("cx", d => center.x + Math.cos(d.angle) * radius)
                .attr("cy", d => center.y + Math.sin(d.angle) * radius);

            // Draw Nodes
            svg.selectAll(".node").data(nodes).join("circle")
                .attr("class", "node")
                .attr("r", 15)
                .attr("cx", d => center.x + Math.cos(d.angle) * radius)
                .attr("cy", d => center.y + Math.sin(d.angle) * radius)
                .style("fill", d => d.color);

            // Key Assignment Lines
            // (Simplified Visualization)
        }

        draw();

        function addNode() {
            nodes.push({ id: "D", angle: 3, color: "#E91E63" }); // Insert D between B and C
            draw();
            alert("Node D added at angle 3.0. Keys between 2.0 and 3.0 moved from C to D.");
        }
    </script>
</body>

</html>
