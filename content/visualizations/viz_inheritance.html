<!DOCTYPE html>
<html>

<head>
    <title>Inheritance: The Family Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .node circle {
            fill: #1e293b;
            stroke: #64748b;
            stroke-width: 2px;
            transition: all 0.5s;
            cursor: pointer;
        }

        .node text {
            font-size: 14px;
            fill: #cbd5e1;
            pointer-events: none;
            text-anchor: middle;
            dy: 4;
        }

        .link {
            fill: none;
            stroke: #475569;
            stroke-width: 2px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            background: #1e293b;
            padding: 10px;
            border-radius: 30px;
            border: 1px solid #334155;
        }

        .trait-btn {
            background: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            gap: 5px;
            align-items: center;
            transition: 0.2s;
        }

        .trait-btn:hover {
            background: #475569;
        }

        .node.has-heart circle {
            fill: #ef4444;
            stroke: #fee2e2;
            box-shadow: 0 0 20px red;
        }

        .node.has-brain circle {
            stroke-width: 4px;
            stroke: #60a5fa;
        }

        .node.has-legs circle {
            stroke-dasharray: 4;
        }
    </style>
</head>

<body>
    <h1>🧬 Pillar 3: Inheritance</h1>
    <p style="color: #94a3b8;">Click a button to add a trait to the <b>Parent (Animal)</b>. Watch it flow down
        automatically.</p>

    <div class="controls">
        <button class="trait-btn" onclick="addTrait('heart')">❤️ Add Heart (Standard)</button>
        <button class="trait-btn" onclick="addTrait('brain')">🧠 Add Brain (Intelligence)</button>
        <button class="trait-btn" onclick="addTrait('legs')">🦵 Add Legs (Movement)</button>
        <button class="trait-btn" onclick="reset()">🔄 Reset</button>
    </div>

    <div id="viz"></div>

    <script>
        const data = {
            name: "Animal (Parent)",
            class: "parent",
            children: [
                { name: "Dog", class: "child" },
                { name: "Cat", class: "child" },
                { name: "Human", class: "child" }
            ]
        };

        const width = 800, height = 400;
        const svg = d3.select("#viz").append("svg").attr("width", width).attr("height", height);

        const treeLayout = d3.tree().size([width - 100, height - 100]);
        const root = d3.hierarchy(data);
        treeLayout(root);

        // Links
        svg.selectAll(".link")
            .data(root.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.linkVertical().x(d => d.x + 50).y(d => d.y + 50));

        // Nodes
        const nodes = svg.selectAll(".node")
            .data(root.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x + 50},${d.y + 50})`);

        nodes.append("circle")
            .attr("r", 30)
            .attr("id", d => d.data.class);

        nodes.append("text")
            .attr("dy", 45)
            .text(d => d.data.name);

        function addTrait(trait) {
            // Apply to everyone because they inherit!
            d3.selectAll("circle").classed("has-" + trait, true);

            // Animation effect
            d3.select("#parent")
                .transition().duration(200).attr("r", 40)
                .transition().duration(200).attr("r", 30);

            setTimeout(() => {
                d3.selectAll("#child")
                    .transition().duration(200).attr("r", 35)
                    .transition().duration(200).attr("r", 30);
            }, 300);
        }

        function reset() {
            d3.selectAll("circle")
                .classed("has-heart", false)
                .classed("has-brain", false)
                .classed("has-legs", false);
        }
    </script>
</body>

</html>
