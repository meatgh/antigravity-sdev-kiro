<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DI vs Static</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #fff;
            text-align: center;
        }

        .node {
            fill: #2196F3;
            stroke: #fff;
        }

        .static {
            fill: #F44336;
        }

        .link {
            stroke: #999;
            stroke-width: 2px;
        }

        .label {
            fill: #fff;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>Static Coupling vs Dependency Injection</h1>
    <p>Red = Static (Tight Coupling). Blue = Injected (Loose Coupling).</p>
    <svg width="600" height="400" id="viz"></svg>
    <script>
        const svg = d3.select("#viz");

        let nodes = [
            { id: "Client", x: 300, y: 50, type: "client" },
            { id: "StaticUtils", x: 100, y: 250, type: "static" },
            { id: "Service A", x: 250, y: 250, type: "service" },
            { id: "Service B", x: 400, y: 250, type: "service" }
        ];

        let links = [
            { source: "Client", target: "StaticUtils", type: "static" },
            { source: "Client", target: "Service A", type: "di" },
            { source: "Client", target: "Service B", type: "di" }
        ];

        svg.selectAll(".link").data(links).enter().append("line")
            .attr("x1", d => nodes.find(n => n.id == d.source).x)
            .attr("y1", d => nodes.find(n => n.id == d.source).y)
            .attr("x2", d => nodes.find(n => n.id == d.target).x)
            .attr("y2", d => nodes.find(n => n.id == d.target).y)
            .attr("stroke", d => d.type === "static" ? "red" : "#2196F3")
            .attr("stroke-width", 2);

        svg.selectAll(".node").data(nodes).enter().append("circle")
            .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", 20)
            .attr("fill", d => d.type === "static" ? "red" : "#2196F3");

        svg.selectAll(".label").data(nodes).enter().append("text")
            .attr("x", d => d.x).attr("y", d => d.y - 25)
            .text(d => d.id).attr("class", "label").attr("text-anchor", "middle");

    </script>
</body>

</html>
