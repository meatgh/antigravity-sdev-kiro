<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceLoader (SPI) Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: #569cd6;
        }

        .stage {
            width: 100%;
            max-width: 900px;
            height: 400px;
            border: 2px solid #333;
            background: #252526;
            position: relative;
            padding: 10px;
        }

        .classpath-container {
            display: flex;
            gap: 10px;
            position: absolute;
            top: 50px;
            left: 50px;
        }

        .jar {
            width: 100px;
            height: 120px;
            border: 2px solid #555;
            background: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
        }

        .jar-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .meta-inf {
            width: 80px;
            height: 20px;
            background: #ce9178;
            font-size: 10px;
            color: #000;
            text-align: center;
            margin-bottom: 5px;
            opacity: 0.3;
        }

        .meta-inf.found {
            opacity: 1;
            border: 2px solid #fff;
        }

        .loader {
            position: absolute;
            bottom: 50px;
            left: 400px;
            width: 150px;
            height: 100px;
            border: 2px dashed #4ec9b0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #4ec9b0;
        }

        .scan-line {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 5px;
            height: 150px;
            background: #569cd6;
            opacity: 0;
            box-shadow: 0 0 10px #569cd6;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .log {
            margin-top: 20px;
            width: 900px;
            height: 100px;
            background: #111;
            border: 1px solid #333;
            overflow-y: auto;
            padding: 5px;
            color: #0f0;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h1>ServiceLoader.load(Payment.class)</h1>

    <div class="stage">
        <div class="classpath-container" id="cp">
            <div class="jar" id="jar1">
                <div class="jar-label">Core.jar</div>
                <div class="meta-inf">No Config</div>
            </div>
            <div class="jar" id="jar2">
                <div class="jar-label">Paypal.jar</div>
                <div class="meta-inf" id="mf2">META-INF</div>
            </div>
            <div class="jar" id="jar3">
                <div class="jar-label">Stripe.jar</div>
                <div class="meta-inf" id="mf3">META-INF</div>
            </div>
            <div class="jar" id="jar4">
                <div class="jar-label">Utils.jar</div>
                <div class="meta-inf">No Config</div>
            </div>
        </div>

        <div class="scan-line" id="scanner"></div>

        <div class="loader" id="loader">
            ServiceLoader<br>Iterator
        </div>
    </div>

    <div class="controls">
        <button onclick="scan()">Scan Classpath</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `> ${msg}<br>`;
            l.scrollTop = l.scrollHeight;
        }

        async function scan() {
            log("Starting scan of META-INF/services/com.api.Payment...");
            const scanner = document.getElementById("scanner");
            const jars = ["jar1", "jar2", "jar3", "jar4"];

            scanner.style.opacity = 1;

            for (let i = 0; i < jars.length; i++) {
                const jarId = jars[i];
                const jarEl = document.getElementById(jarId);
                const rect = jarEl.getBoundingClientRect();
                const containerRect = document.querySelector(".stage").getBoundingClientRect();

                // Move scanner
                const left = rect.left - containerRect.left + 50;
                scanner.style.left = left + "px";

                log(`Scanning ${jarEl.children[0].innerText}...`);

                await new Promise(r => setTimeout(r, 800));

                if (jarId === "jar2") {
                    document.getElementById("mf2").classList.add("found");
                    log("✅ Found META-INF! Registered: com.paypal.PayPalProvider");
                    animateInstantiate("com.paypal.PayPalProvider");
                } else if (jarId === "jar3") {
                    document.getElementById("mf3").classList.add("found");
                    log("✅ Found META-INF! Registered: com.stripe.StripeProvider");
                    animateInstantiate("com.stripe.StripeProvider");
                } else {
                    log("... No services found.");
                }
            }

            scanner.style.opacity = 0;
            log("Scan Complete.");
        }

        function animateInstantiate(cls) {
            const loader = document.getElementById("loader");
            const token = document.createElement("div");
            token.innerText = cls;
            token.style.position = "absolute";
            token.style.top = "50px";
            token.style.left = "50%";
            token.style.color = "#4ec9b0";
            token.style.fontSize = "12px";
            token.style.opacity = 1;
            token.style.transition = "all 1s";
            loader.appendChild(token);

            setTimeout(() => {
                token.style.top = "10px";
                token.style.opacity = 0;
            }, 1000);
        }
    </script>
</body>

</html>
