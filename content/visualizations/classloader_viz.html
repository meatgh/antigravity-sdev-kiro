<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLoader Hierarchy Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #569cd6;
        }

        .tree-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            border: 2px solid #333;
            background: #252526;
            position: relative;
        }

        .node circle {
            fill: #4ec9b0;
            stroke: #fff;
            stroke-width: 2px;
        }

        .node text {
            font-size: 14px;
            fill: #d4d4d4;
            font-weight: bold;
        }

        .link {
            fill: none;
            stroke: #555;
            stroke-width: 2px;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .log {
            margin-top: 20px;
            width: 800px;
            height: 100px;
            background: #111;
            border: 1px solid #333;
            overflow-y: auto;
            padding: 5px;
            color: #0f0;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h1>ClassLoader Delegation Model</h1>

    <div class="tree-container" id="tree"></div>

    <div class="controls">
        <button onclick="loadRequest('App', 'java.lang.String')">Load java.lang.String (from App)</button>
        <button onclick="loadRequest('App', 'com.myapp.User')">Load com.myapp.User (from App)</button>
        <button onclick="loadRequest('Plugin1', 'com.lib.v1.Util')">Load Util v1 (from Plugin1)</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        const treeData = {
            name: "Bootstrap",
            children: [
                {
                    name: "Platform",
                    children: [
                        {
                            name: "App (System)",
                            children: [
                                { name: "Plugin1 (Child-First)" },
                                { name: "Plugin2" }
                            ]
                        }
                    ]
                }
            ]
        };

        const margin = { top: 40, right: 90, bottom: 50, left: 90 },
            width = 800 - margin.left - margin.right,
            height = 500 - margin.top - margin.bottom;

        const svg = d3.select("#tree").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        const treemap = d3.tree().size([height, width]);
        let nodes = d3.hierarchy(treeData, d => d.children);
        nodes = treemap(nodes);

        const link = svg.selectAll(".link")
            .data(nodes.descendants().slice(1))
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d => {
                return "M" + d.y + "," + d.x
                    + "C" + (d.y + d.parent.y) / 2 + "," + d.x
                    + " " + (d.y + d.parent.y) / 2 + "," + d.parent.x
                    + " " + d.parent.y + "," + d.parent.x;
            });

        const node = svg.selectAll(".node")
            .data(nodes.descendants())
            .enter().append("g")
            .attr("class", d => "node" + (d.children ? " node--internal" : " node--leaf"))
            .attr("transform", d => "translate(" + d.y + "," + d.x + ")");

        node.append("circle")
            .attr("r", 10)
            .attr("id", d => "node-" + d.data.name.split(" ")[0]);

        node.append("text")
            .attr("dy", ".35em")
            .attr("x", d => d.children ? -13 : 13)
            .style("text-anchor", d => d.children ? "end" : "start")
            .text(d => d.data.name);

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `> ${msg}<br>`;
            l.scrollTop = l.scrollHeight;
        }

        function highlight(name, color) {
            d3.select("#node-" + name).transition().duration(500).style("fill", color);
            setTimeout(() => {
                d3.select("#node-" + name).transition().duration(500).style("fill", "#4ec9b0");
            }, 1000);
        }

        async function loadRequest(loader, className) {
            log(`[${loader}] Request to load '${className}'`);

            if (className.startsWith("java.")) {
                // Delegation up to Bootstrap
                await new Promise(r => setTimeout(r, 500));
                log(`[${loader}] Delegating up...`);
                highlight("App", "#e3a21a");

                await new Promise(r => setTimeout(r, 500));
                log(`[Platform] Delegating up...`);
                highlight("Platform", "#e3a21a");

                await new Promise(r => setTimeout(r, 500));
                log(`[Bootstrap] Found core class!`);
                highlight("Bootstrap", "#0f0");
                return;
            }

            if (loader === "Plugin1" && className.includes("Util")) {
                // Child First
                await new Promise(r => setTimeout(r, 500));
                log(`[Plugin1] Child-First Strategy detected.`);
                log(`[Plugin1] Found internally!`);
                highlight("Plugin1", "#0f0");
                return;
            }

            // Standard App Load
            log(`[App] Searching classpath...`);
            highlight("App", "#0f0");
            log(`[App] Loaded!`);
        }
    </script>
</body>

</html>
