
<!DOCTYPE html>
<html>
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .bar-container { width: 80%; height: 30px; background: #333; margin: 20px auto; border-radius: 5px; position: relative; overflow: hidden; }
        .bar { height: 100%; background: #4CAF50; width: 0%; transition: width 0.2s; border-radius: 5px; }
        .danger { background: #F44336; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 4px; background: #2196F3; color: white; transition: background 0.3s; }
        button:hover { background: #1976D2; }
        button.clear { background: #f44336; }
        button.clear:hover { background: #d32f2f; }
        .tree { opacity: 0.8; }
        #stats { font-size: 1.2em; margin-bottom: 20px; font-family: monospace; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 0.9em; color: #ccc; }
    </style>
</head>
<body>
    <h2>Controls: Flyweight Pattern (Memory Optimization)</h2>
    <div class="legend">
        <span>Oak Tree (Intrinsic: 10MB)</span>
        <span>Pine Tree (Intrinsic: 10MB)</span>
    </div>
    
    <button onclick="spawnTrees(false)">❌ Spawn 1000 Trees (Naive)</button>
    <button onclick="spawnTrees(true)">✅ Spawn 1000 Trees (Flyweight)</button>
    <button class="clear" onclick="clearForest()">🗑️ Clear Memory</button>
    
    <div class="bar-container">
        <div id="memBar" class="bar"></div>
        <div style="position: absolute; width: 100%; text-align: center; color: white; font-weight: bold; line-height: 30px; top: 0;">RAM Usage</div>
    </div>
    <p id="stats">Memory: 0.00 MB | Objects: 0 | Intrinsic Types: 0</p>
    
    <div id="forest"></div>

    <script>
        const width = 800, height = 400;
        const svg = d3.select("#forest").append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background", "#222")
            .style("border-radius", "8px");
        
        // Simulating 10MB per Intrinsic Object (Mesh + Texture)
        const INTRINSIC_SIZE_MB = 10;
        // Simulating 24 bytes per Extrinsic Object (Coordinates) -> 0.000024 MB
        const EXTRINSIC_SIZE_MB = 0.000024; 

        let memoryUsage = 0;
        let objectCount = 0;
        let intrinsicCount = 0;
        let flyweightStore = {}; // The Cache

        function clearForest() {
            svg.selectAll("*").remove();
            memoryUsage = 0;
            objectCount = 0;
            intrinsicCount = 0;
            flyweightStore = {};
            updateStats();
        }

        function updateStats() {
            document.getElementById("stats").innerText = 
                `Memory: ${memoryUsage.toFixed(2)} MB | Objects: ${objectCount} | Intrinsic Types: ${intrinsicCount}`;
            
            const bar = document.getElementById("memBar");
            // Scale: 10000 MB max for visual
            let pct = (memoryUsage / 20000) * 100; 
            if (pct > 100) pct = 100;
            
            bar.style.width = pct + "%";
            if (pct > 80) bar.classList.add("danger"); else bar.classList.remove("danger");
        }

        window.spawnTrees = function(useFlyweight) {
            const batchSize = 100; 
            
            for (let i = 0; i < batchSize; i++) {
                const type = Math.random() > 0.5 ? "Oak" : "Pine";
                const x = Math.random() * width;
                const y = Math.random() * height;
                const color = type === "Oak" ? "#4CAF50" : "#2E7D32";
                
                // DATA MODEL SIMULATION
                if (useFlyweight) {
                    // Intrinsic State (Heavy) is gathered via Factory
                    if (!flyweightStore[type]) {
                        flyweightStore[type] = true;
                        memoryUsage += INTRINSIC_SIZE_MB; 
                        intrinsicCount++;
                    }
                    // Extrinsic State (Light)
                    memoryUsage += EXTRINSIC_SIZE_MB;
                } else {
                    // Naive: New Heavy Object every time
                    // 10MB + tiny coords
                    memoryUsage += INTRINSIC_SIZE_MB + EXTRINSIC_SIZE_MB; 
                }
                objectCount++;

                svg.append("circle")
                    .attr("cx", x).attr("cy", y)
                    .attr("r", 4)
                    .attr("fill", color)
                    .attr("class", "tree")
                    .transition().duration(500)
                    .attr("r", 6);
            }
            updateStats();
        };
    </script>
</body>
</html>
